[experiment_params]
neptune_project = "Elise-tests"
seed = 42
patterns = ['random']
group_tag = 'non-markvo-test'
pre_transforms = ['to_biounits'] # ORDER MATTERS GREATLY

[network_params]
num_lat = 100
num_vis = 10

[weight_params]
p = 0.2
q = 0.15
p0 = 0.04
W_vis_vis = [0.0, 0.1]
W_vis_lat = [0.0, 0.1]
W_lat_lat = [0.0, 0.1]
W_lat_vis = [0.0, 0.1]
d_den = [5, 25]
d_som = [5, 25]
d_int = 15

[simulation_params]
dt = 0.1
training_epochs = 25
replay_epochs = 50
training_cycles = 25
validation_cycles = 2
replay_cycles = 2
eta_out = 10e-4
eta_lat = 10e-3
eta_decay = 0.98

[pattern_params]
pattern_duration = 40.0
pattern_dt = 15.0
noise_sigma = 0.0
noise_tau = 0.0
non_markov = 12
non_markov_type = "copied"

[replay_params]
disruption = -70
partial_replay = false
replay_learning = true

[neuron_params]
C_v = 1.0
C_u = 1.0
E_l = -70.0
E_exc = 0.0
E_inh = -75.0
g_l = 0.1
g_den = 2.0
g_exc_0 = 0.3
g_inh_0 = 6.0
a   = 0.3
b   = -58.0
lam = 0.7

[tracking_params]
sim_step = 4

vars_train = [
  ["u", "visible" ],
  ["u_inp", "visible" ],
  ["r", "latent" ],
  ["r", "visible" ],
  ]

vars_val = [
  ["u", "visible"],
  ["r", "visible"],
  ]

vars_epoch = [
  ["dendritic_weights", "all" ],
  ]

vars_replay = [
  ["u", "visible" ],
  ["r", "visible" ],
  ["r", "latent" ]
  ]
