[experiment_params]
neptune_project = "Rework"

[network_params]
num_lat = 70
num_vis = 30

[weight_params]
weight_type = "developed" # developed, random
p = 0.2
q = 0.15
p0 = 0.04
W_vis_vis = [-0.0, 0.5]
W_vis_lat = [-0.0, 0.5]
W_lat_lat = [-0.0, 0.5]
W_lat_vis = [-0.0, 0.5]
d_den = [5, 15]
d_som = [5, 15]
d_int = 25
d_den_seed = -1 # -1 seed random, else seed fixed
d_som_seed = -1 # -1 seed random, else seed fixed
w_den_seed = -1 # -1 seed random, else seed fixed
w_som_seed = -1 # -1 seed random, else seed fixed

[simulation_params]
dt = 0.1
training_epochs = 400
replay_epochs = 50
training_cycles = 25
validation_cycles = 2
replay_cycles = 2
eta_out = 10e-4
eta_lat = 10e-3
eta_decay = 0.99

[pattern_params]
pattern_duration = 250.0
pattern_dt = 1.0
noise_sigma = 8.0
noise_tau = 100.0
non_markov = 12
non_markov_type = "copied"

[neuron_params]
C_v = 1.0
C_u = 1.0
E_l = -70.0
E_exc = 0.0
E_inh = -75.0
g_l = 0.1
g_den = 2.0
g_exc_0 = 0.3
g_inh_0 = 6.0
a   = 0.3
b   = -58.0
lam = 0.7

[tracking_params]
sim_step = 4
track_training = true

vars_train = [
  ["u", "visible" ],
  ["u_inp", "visible" ],
  ["r", "visible" ],
  ]

vars_val = [
  ["u", "visible"],
  ["r", "visible"],
  ]

vars_epoch = [
  ["dendritic_weights", "all" ],
  ["u", "visible"],
  ]

vars_replay = [
  ["u", "visible" ],
  ["r", "visible" ],
  ]
