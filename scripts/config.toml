[experiment_params]
mlflow_experiment = "Multipattern"  # string: name of the MLflow experiment
seed = 2                           # int: global random seed
patterns = ['fuer_elise_original']
group_tag = ['multi_pattern_shuffle']               # list[str]: tags for grouping/filtering runs in MLflow
pre_transforms =  ['to_biounits']  # list[str]: transforms applied once before training — ORDER MATTERS
online_transforms =  []            # list[str]: transforms applied each step during training (e.g. 'noise_corr', 'noise_white')
dataloader_type = "shuffle"          # str: "multi" (patterns concatenated in width, simultaneous) or "shuffle" (patterns presented sequentially, one at a time)
shuffle_block_size = 4       # int: consecutive presentations of each pattern before switching (1=random, N>1=blocked)
replay_learning = true             # bool: if true, weights are updated during replay

[noise_params]
disruption = 0.0          # float: membrane potential (mV) that visible neurons are clamped to during the disruption window in replay (0.0 = no disruption)
partial_replay = false    # bool: if true, cue the network with the first partial_replay_fraction of the pattern during replay epoch 1
partial_replay_fraction = 0.25  # float [0, 1]: fraction of pattern duration used as cue in partial replay
w_noise_sigma = 0.0  # float >= 0: std dev of weight noise (0.0 = no noise)
w_noise_tau = 0      # int >= 0: time constant (steps) for weight noise correlation — Ornstein-Uhlenbeck process (0 = i.i.d. white noise)
u_noise_sigma = 0.0  # float >= 0: std dev of membrane-potential noise (0.0 = no noise)
u_noise_tau = 0      # int >= 0: time constant (steps) for u noise correlation — Ornstein-Uhlenbeck process (0 = i.i.d. white noise)

[network_params]
num_lat = 50  # int: number of latent neurons
num_vis = 4  # int: number of visible neurons

[weight_params]
weight_type = "developed" # str: "developed" (structured probabilistic init) or "random"
p = 0.2                   # float [0, 1]: per-synapse connection probability — probability of adding each successive connection
q = 0.0                   # float [0, 1]: controls probability that a target neuron accepts an incoming connection
p0 = 0.04                 # float [0, 1]: baseline connection probability for the first connection attempt to a neuron
W_vis_vis = [-0.5, 0.5]   # [min, max]: initial weight range for visible→visible connections
W_vis_lat = [-0.5, 0.5]   # [min, max]: initial weight range for visible→latent connections
W_lat_lat = [-0.5, 0.5]   # [min, max]: initial weight range for latent→latent connections
W_lat_vis = [-0.5, 0.5]   # [min, max]: initial weight range for latent→visible connections
d_den = [5, 25]           # [min, max]: dendritic (plastic) synaptic delay range (steps)
d_som = [5, 25]           # [min, max]: somatic (fixed) synaptic delay range (steps)
d_int = 25                # int: fixed delay for all lateral inhibitory synapses (steps)
d_den_seed = -1           # int: seed for dendritic delay sampling (-1 = random each run)
d_som_seed = -1           # int: seed for somatic delay sampling (-1 = random each run)
w_den_seed = -1           # int: seed for dendritic weight sampling (-1 = random each run)
w_som_seed = -1           # int: seed for somatic weight sampling (-1 = random each run)

[simulation_params]
dt = 0.1                # float: integration time step (ms)
training_epochs = 20   # int: number of full training epochs
replay_epochs = 50      # int: number of replay epochs after training
training_cycles = 50    # int: pattern repetitions per training epoch
validation_cycles = 2   # int: pattern repetitions per validation pass
replay_cycles = 2       # int: pattern repetitions per replay epoch
eta_out = 0.001         # float > 0: learning rate for visible (output) weights (scaled internally by 1/dt)
eta_lat = 0.01          # float > 0: learning rate for latent weights (scaled internally by 1/dt)
eta_decay = 1       # float [0, 1]: multiplicative learning-rate decay applied after each epoch
eval_cue_cycles = 4   # int: pattern repetitions used to cue the network before free-recall evaluation
eval_free_cycles = 1  # int: pattern repetitions of free activity to measure after cueing
eval_workers = 1      # int: number of parallel workers for per-pattern evaluation (1 = sequential)

[pattern_params]
pattern_duration = 250.0       # float: total pattern duration (ms)
pattern_dt = 15.0               # float: pattern time resolution (ms)
noise_sigma = 0.0              # float >= 0: std dev of input pattern noise
noise_tau = 100.0              # float > 0: time constant of input noise correlation (ms)
non_markov = 12                # int >= 0: number of timesteps of non-Markovian structure in the pattern
non_markov_type = "copied"     # str: method for building non-Markovian patterns — "none", "sampled", or "copied" (copies first-half chunk into second half)
biounits_scale = 20.0          # float: mV range for scaling normalized pattern values to biological units

[neuron_params]
C_v = 1.0      # float > 0: membrane capacitance of visible neurons
C_u = 1.0      # float > 0: membrane capacitance of latent neurons
E_l = -70.0    # float: leak reversal potential (mV)
E_exc = 0.0    # float: excitatory reversal potential (mV)
E_inh = -75.0  # float: inhibitory reversal potential (mV)
g_l = 0.1      # float > 0: leak conductance
g_den = 2.0    # float > 0: dendritic conductance coupling
g_exc_0 = 0.3  # float > 0: baseline excitatory conductance
g_inh_0 = 6.0  # float > 0: baseline inhibitory conductance
a   = 0.3      # float: slope of the sigmoid activation phi(u) = 1 / (1 + exp(a*(b - u)))
b   = -58.0    # float: voltage threshold of the sigmoid — membrane potential (mV) at which firing rate is 0.5
lam = 0.7      # float [0, 1]: dendritic-somatic coupling weight, balancing dendritic vs. somatic input contributions

[tracking_params]
sim_step = 4                   # int >= 1: record state every N simulation steps (higher = less data stored)
track_training = true          # bool: if true, record variables during training (not just validation)
early_tracking_patterns = 6   # int: record training activity for the first N pattern repetitions

vars_train = [
  ["u", "visible" ],
  ["u_inp", "visible" ],
  ["r", "visible" ],
  ["r", "latent" ],
  ]

vars_val = [
  ["u", "visible"],
  ["r", "visible"],
  ]

vars_epoch = [
  ["dendritic_weights", "all" ],
  ["u", "visible"],
  ]

vars_replay = [
  ["u", "visible" ],
  ["r", "visible" ],
  ["r", "latent" ],
  ]
